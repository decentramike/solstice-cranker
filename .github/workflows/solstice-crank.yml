# Sends the two permissionless Solstice cranks when chain state says one is due:
#   submitShares(Q)       on the Service Rewards Actor
#   quarterlyGateCheck()  on the Stream Weight Actor
#
# It runs only inside a crank window. The first job, `gate`, reads
# config/schedule.<NETWORK>.json -- no npm ci, no key -- and ends in seconds unless a window
# is open:
#
#   opens   one hour before quarter Q binds (binding = when submitShares(Q) becomes callable)
#   closes  when submitShares(Q) AND the gate check due at Q have both landed on chain
#
# Every trigger runs for the first 72 hours of a window, then one hour in six until the work
# lands. Elapsed time never closes a window. Outside one, the crank job does not even start.
#
# submitShares(Q) has a hard deadline: it must land before quarter Q+1 binds, or quarter Q's
# share map is lost for good (NotLatestQuarter). The gate fails open: a missing schedule file
# or an unreadable chain means the crank runs.
#
# This job holds a private key. It gets `contents: read` and nothing else.
#
# Source: https://github.com/filecoin-project/solstice/issues/68
# Operations: docs/RUNBOOK.md

name: Solstice crank

on:
  schedule:
    # Hourly, off the hour. GitHub drops and delays scheduled runs; the primary timer is the
    # external one (cron-job.org, every 15 minutes, through workflow_dispatch) -- see
    # docs/RUNBOOK.md, "Reliable scheduling". Both go through the same gate.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read chain state, decide, simulate, broadcast nothing.'
        type: boolean
        required: false
        default: false
      ignore_window:
        description: 'Run even outside a crank window. For a person at the keyboard; the external timer never sets it.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # One crank at a time, across the schedule, the external timer and manual runs. Never cancel
  # a run in flight: it may already have broadcast, and a cancelled run cannot say whether it landed.
  group: solstice-crank
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Check out the schedule and the gate only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            config
            scripts/gate.mjs
            src/windows.mjs
          sparse-checkout-cone-mode: false

      - name: Is a crank window open?
        id: gate
        env:
          NETWORK: ${{ vars.NETWORK }}
          # Only to read three storage words when the clock says a window is open. No key here.
          RPC_URL: ${{ secrets.RPC_URL }}
          SRA_ADDRESS: ${{ vars.SRA_ADDRESS }}
          SWA_ADDRESS: ${{ vars.SWA_ADDRESS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          IGNORE_WINDOW: ${{ inputs.ignore_window && 'true' || '' }}
        run: node scripts/gate.mjs crank

  crank:
    name: Crank
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A catch-up run can send up to CRANK_MAX_GATE_CATCHUP (default 8) gate calls, each
    # waiting on confirmations at 30s per epoch. 20 minutes covers that with room spare.
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Nothing here pushes. Do not leave a git credential on a runner holding a key.
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install runtime dependencies only
        # --omit=dev keeps hardhat, the devnet and the dashboard off this runner.
        run: npm ci --omit=dev

      - name: Crank
        env:
          NETWORK: ${{ vars.NETWORK }}
          RPC_URL: ${{ secrets.RPC_URL }}
          CRANKER_PRIVATE_KEY: ${{ secrets.CRANKER_PRIVATE_KEY }}

          # --- contract addresses; blank falls back to config/networks.json ---
          SRA_ADDRESS: ${{ vars.SRA_ADDRESS }}
          SWA_ADDRESS: ${{ vars.SWA_ADDRESS }}

          # --- the stop switch, and the Mainnet send switch ---
          CRANK_PAUSED: ${{ vars.CRANK_PAUSED }}
          MAINNET_SEND_ENABLED: ${{ vars.MAINNET_SEND_ENABLED }}

          # --- behaviour ---
          CRANK_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CRANK_MAX_GATE_CATCHUP: ${{ vars.CRANK_MAX_GATE_CATCHUP }}
          CRANK_MIN_BALANCE_FIL: ${{ vars.CRANK_MIN_BALANCE_FIL }}
          CRANK_CONFIRMATIONS: ${{ vars.CRANK_CONFIRMATIONS }}
          CRANK_LOG_LEVEL: ${{ vars.CRANK_LOG_LEVEL }}

          # --- the Claim wallet's public address, for its low-balance check. Never its key. ---
          CLAIM_ADDRESS: ${{ vars.CLAIM_ADDRESS }}
          CLAIM_MIN_BALANCE_FIL: ${{ vars.CLAIM_MIN_BALANCE_FIL }}

          # --- alerting; all optional, console + job summary when unset ---
          ALERT_TRANSPORT: ${{ vars.ALERT_TRANSPORT }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/crank.mjs

      - name: Point at the runbook on failure
        if: failure()
        run: |
          {
            echo '## Crank run failed'
            echo
            echo 'Read the step log above for the decoded revert reason, then follow'
            echo '`docs/RUNBOOK.md` -> "What each alert means".'
            echo
            echo 'If the reason is `NotLatestQuarter`, that quarter'"'"'s share map is'
            echo 'lost and cannot be re-sent. Escalate, do not retry.'
          } >> "$GITHUB_STEP_SUMMARY"
